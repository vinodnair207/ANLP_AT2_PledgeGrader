# Project metadata and dependencies for uv. Run `uv sync` to create .venv and install everything.
[project]
name = "pledgegrader"
version = "0.1.0"
description = "Web application that grades corporate net zero pledges using three NLP methods"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "datasets>=2.18",
    "transformers>=4.40",
    "torch>=2.2",
    "streamlit>=1.35",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[dependency-groups]
# Development tools, installed by default with `uv sync`.
dev = ["pytest>=8.0"]

[tool.uv]
# The repository is an application, not an installable package, so no build step is needed.
package = false

[tool.pytest.ini_options]
# Lets tests import the src package from the repository root.
pythonpath = ["."]
testpaths = ["tests"]
